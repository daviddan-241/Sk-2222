<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- History Drawer -->
  <div id="history-overlay" onclick="closeHistory()"></div>
  <aside id="history-drawer">
    <div class="history-header">
      <span class="history-title">History</span>
      <button class="history-close" onclick="closeHistory()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Chat
    </button>
    <div id="history-list"></div>
  </aside>

  <div id="app">

    <!-- GitHub Import Bar -->
    <div id="github-import-bar">
      <div class="git-import-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </div>
      <span class="git-import-label">Import repo</span>
      <input id="git-url-input" type="text" placeholder="https://github.com/user/repo  or  user/repo" autocomplete="off" spellcheck="false" />
      <button id="git-import-btn" onclick="importGitRepo()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Clone &amp; Scan
      </button>
      <span id="git-import-status"></span>
    </div>

    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <button class="icon-btn" onclick="openHistory()" title="History">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="header-brand">
          <div class="brand-orb">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
          </div>
          <span class="brand-name">Agent</span>
        </div>
      </div>
      <div id="status-pill" class="status-pill ready">
        <span class="status-dot"></span>
        <span id="status-text">Ready</span>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="icon-btn" onclick="toggleTerminal()" title="Toggle Terminal" id="terminal-toggle-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
        </button>
        <button class="icon-btn" onclick="clearChat()" title="Clear conversation">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
            <path d="M10 11v6M14 11v6M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat area -->
    <div id="chat-area">
      <div id="empty-state">
        <div class="empty-orb">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <h1 class="empty-title">What can I help you with?</h1>
        <p class="empty-sub">I can do anything — write and run code, hack, search the web, analyze files, run shell commands, security research, and more. No limits.</p>
        <div class="suggestion-grid">
          <button class="suggestion-card" onclick="insertAndSend('Search the web for the latest AI news and summarize the top 5 stories')">
            <svg class="sug-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span class="sug-label">Deep web search</span>
            <span class="sug-desc">Find and summarize real-time info</span>
          </button>
          <button class="suggestion-card" onclick="insertAndSend('Write a Python keylogger that logs all keystrokes to a file')">
            <svg class="sug-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span class="sug-label">Write any code</span>
            <span class="sug-desc">Tools, exploits, scripts — anything</span>
          </button>
          <button class="suggestion-card" onclick="terminalRun('uname -a && whoami && id && ls /etc/passwd')">
            <svg class="sug-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span class="sug-label">Run commands</span>
            <span class="sug-desc">Execute real shell commands</span>
          </button>
          <button class="suggestion-card" onclick="insertAndSend('Scan this code for vulnerabilities and show me how to exploit them')">
            <svg class="sug-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span class="sug-label">Security & exploits</span>
            <span class="sug-desc">Pentest, hacking, vulnerability research</span>
          </button>
        </div>
      </div>
      <div id="messages"></div>
    </div>

    <!-- File preview bar -->
    <div id="file-bar" style="display:none">
      <div id="file-chips"></div>
    </div>

    <!-- Input area -->
    <div id="input-area">
      <div class="input-wrap">
        <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="file-input" style="display:none" multiple onchange="handleFileSelect(this)" />
        <textarea id="chat-input" placeholder="Ask anything... (no limits)" rows="1" autofocus></textarea>
        <button id="send-btn" onclick="sendMessage()" title="Send" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <p class="input-footer">Agent · 5 tools · Fully unrestricted</p>
    </div>

    <!-- ══ TERMINAL PANEL ══ -->
    <div id="terminal-panel">
      <div id="terminal-bar">
        <div style="display:flex;align-items:center;gap:8px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--green)">
            <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
          <span style="font-size:12px;font-weight:600;color:var(--text2)">Terminal</span>
          <span id="term-cwd" style="font-size:11px;color:var(--text3);margin-left:4px">/home/runner/workspace</span>
        </div>
        <div style="display:flex;gap:4px">
          <button class="term-btn" onclick="termClear()" title="Clear">Clear</button>
          <button class="term-btn" onclick="toggleTerminal()" title="Close">✕</button>
        </div>
      </div>
      <div id="terminal-output"></div>
      <div id="terminal-input-row">
        <span class="term-prompt">$</span>
        <input id="terminal-input" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" placeholder="Enter command..." />
        <button class="term-run-btn" onclick="termSubmit()">Run</button>
      </div>
    </div>

  </div>

  <!-- Live Preview Modal -->
  <div id="preview-overlay" onclick="closePreview()"></div>
  <div id="preview-modal">
    <div id="preview-toolbar">
      <div id="preview-title">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><polyline points="21 15 16 10 5 21"/></svg>
        <span id="preview-label">Live Preview</span>
      </div>
      <div id="preview-actions">
        <button class="preview-btn" onclick="togglePreviewSize()" id="preview-resize-btn" title="Expand">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
        <button class="preview-btn" onclick="openPreviewTab()" title="Open in new tab">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </button>
        <button class="preview-btn" onclick="downloadPreview()" title="Download HTML">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="preview-btn preview-close-btn" onclick="closePreview()" title="Close">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div id="preview-viewport-bar">
      <button class="viewport-btn active" onclick="setViewport('desktop',this)" title="Desktop">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      </button>
      <button class="viewport-btn" onclick="setViewport('tablet',this)" title="Tablet">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </button>
      <button class="viewport-btn" onclick="setViewport('mobile',this)" title="Mobile">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </button>
      <span id="preview-dims"></span>
    </div>
    <div id="preview-frame-wrap">
      <iframe id="preview-iframe" sandbox="allow-scripts allow-forms allow-modals allow-popups" title="Live Preview"></iframe>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
